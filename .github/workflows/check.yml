name: Build do Mesa Marcada
on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run check:migrations
      - run: npm run check:reliability
      - run: npm run check:games
      - run: npm run test:tutorials
      - run: npm run test:cards
      - run: npm run test:database
      - run: npm run typecheck
      - run: npm run check:ui
      - run: npm run check:live
      - run: npm run check:finance
      - run: npm run check:invites
      - run: npm run check:leagues
      - run: npm run check:leagues51
      - run: npm run check:crest
      - run: npm run check:edit
      - run: npm run check:refinements
      - run: npm run check:poll
      - run: npm run check:expense
      - run: npm run check:performance
      - run: npm run check:medals
      - run: npm run check:player-previews
      - run: npm run check:frames
      - run: npm run check:founder
      - run: npm run check:brand
      - run: npm run check:scroll
      - run: npm run build
      - run: npm run smoke
